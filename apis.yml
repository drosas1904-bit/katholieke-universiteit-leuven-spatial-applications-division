description: 'The Spatial Applications Division (SADL) of the Katholieke Universiteit Leuven (KU Leuven) conducts research, consultancy, and training in geographic information science and technology. It bridges academic research with practical applications for land management, environmental assessment, and socio‑economic studies, serving public authorities, industry, and the broader community through projects, scientific consulting, and educational programmes.'

